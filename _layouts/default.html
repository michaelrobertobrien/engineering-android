<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
            margin: 20px auto;
            max-width: 900px;
            padding: 0 15px;
        }
        a {
            color: #0000ee;
            text-decoration: none;
        }
        a:visited {
            color: #551a8b;
        }
        a:hover {
            text-decoration: underline;
        }
        hr {
            border: 0;
            border-top: 1px solid #333333;
            margin: 15px 0;
        }
        h1, h2, h3, h4 {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 15px;
        }
        h1 { font-size: 24px; text-align: center; letter-spacing: 1px; }
        h2 { font-size: 18px; border-bottom: 1px dashed #999; padding-bottom: 2px; }
        h3 { font-size: 16px; margin-top: 10px; }
        
        /* MathPages Classic Grid Directory Matrix */
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 40px;
            margin-top: 15px;
        }
        .directory-item {
            font-size: 14px;
            text-align: left;
        }
        
        /* Content formatting for articles */
        .content {
            font-size: 15px;
            text-align: justify;
        }
        pre, code {
            font-family: Courier, monospace;
            font-size: 13px;
            background-color: #f7f7f7;
        }
        pre {
            padding: 8px;
            border: 1px solid #ccc;
            overflow-x: auto;
        }
        .footer {
            font-size: 12px;
            text-align: center;
            margin-top: 40px;
            color: #555555;
        }
    </style>
</head>
<body>

    {{ content }}

    <div class="footer">
        <hr>
        <a href="/">Home</a> | <a href="https://github.com/{{ site.github.repository_nwo }}">Source Code</a>
    </div>

</body>
</html>
