<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <!-- MathJax script for authentic equation rendering -->
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #ffffff;
            color: #000000;
            margin: 40px auto;
            max-width: 720px; /* Traditional print page width */
            padding: 0 20px;
            font-size: 16px;
            line-height: 1.5;
        }
        a {
            color: #0000ee;
            text-decoration: underline;
        }
        a:visited {
            color: #551a8b;
        }
        hr {
            border: 0;
            border-top: 1px solid #000000;
            margin: 12px 0;
        }
        h1 {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .subheader {
            text-align: center;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* The signature MathPages inline dot layout */
        .link-matrix {
            text-align: justify;
            font-size: 15px;
            margin-bottom: 20px;
            text-justify: inter-word;
        }
        .link-matrix a {
            text-decoration: none;
        }
        .link-matrix a:hover {
            text-decoration: underline;
        }
        /* Article body styling */
        .content {
            text-align: justify;
            text-justify: inter-word;
        }
        .content p {
            margin-top: 0;
            margin-bottom: 16px;
            text-indent: 30px; /* Traditional paragraph indent */
        }
        .content p:first-of-type {
            text-indent: 0; /* First paragraph isn't indented */
        }
        pre, code {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
        }
        pre {
            margin: 20px 40px;
            text-align: left;
        }
        .footer {
            font-size: 13px;
            text-align: center;
            margin-top: 60px;
        }
    </style>
</head>
</html>
